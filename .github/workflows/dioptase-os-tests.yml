name: Dioptase Tests

on:
  workflow_dispatch:
    inputs:
      test_runs:
        description: "Number of repetitions for each baseline-checked OS test."
        required: true
        default: "10"
      sleep_after:
        description: "Suspend the Windows host after this manual run."
        type: choice
        required: true
        default: "false"
        options:
          - "false"
          - "true"
  schedule:
    - cron: "5 10,22 * * *"
      timezone: America/Chicago

concurrency:
  group: dioptase-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  toolchain-tests:
    name: Release assembler, full emulator, and compiler test suites
    runs-on:
      - self-hosted
      - linux
      - x64
      - dioptase-os
    timeout-minutes: 720

    defaults:
      run:
        shell: bash

    env:
      DIOPTASE_TOOLCHAIN_TEST_LOG: ${{ runner.temp }}/dioptase-toolchain-tests.log

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check host dependencies
        run: |
          missing=0
          for cmd in awk cargo cmp diff gcc grep make python3 tee timeout; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "Missing required Dioptase toolchain test dependency: $cmd" >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Install the missing tools on the self-hosted runner before running Dioptase toolchain tests." >&2
            exit 1
          fi

      - name: Run release assembler, full emulator, and compiler tests
        run: |
          run_command() {
            label="$1"
            shift
            echo "::group::$label"
            set +e
            "$@" 2>&1 | tee -a "$DIOPTASE_TOOLCHAIN_TEST_LOG"
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if [ "$status" -ne 0 ]; then
              echo "$label failed with status $status." >&2
              exit "$status"
            fi
          }

          run_summary_make() {
            dir="$1"
            target="$2"
            label="$dir $target"
            tmp="$(mktemp)"
            echo "::group::$label"
            set +e
            (cd "$dir" && make "$target") 2>&1 | tee "$tmp" | tee -a "$DIOPTASE_TOOLCHAIN_TEST_LOG"
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if [ "$status" -ne 0 ]; then
              echo "$label exited with status $status." >&2
              exit "$status"
            fi

            summary="$(grep -E 'Summary: [0-9]+ / [0-9]+ tests passed' "$tmp" | tail -n 1 || true)"
            rm -f "$tmp"

            if [ -z "$summary" ]; then
              echo "$label did not print an aggregate test summary." >&2
              exit 1
            fi

            passed="$(printf '%s\n' "$summary" | awk '{print $2}')"
            total="$(printf '%s\n' "$summary" | awk '{print $4}')"
            if [ "$passed" != "$total" ]; then
              echo "$label reported failing tests: $summary" >&2
              exit 1
            fi
          }

          : > "$DIOPTASE_TOOLCHAIN_TEST_LOG"

          run_command "Dioptase-Assembler clean" \
            make -C Dioptase-Assembler clean
          run_command "Dioptase-Assembler release" \
            make -C Dioptase-Assembler release
          run_summary_make Dioptase-Assembler test-release

          run_command "Dioptase-Emulator-Full cargo clean --release" \
            cargo clean --release --manifest-path Dioptase-Emulators/Dioptase-Emulator-Full/Cargo.toml
          run_command "Dioptase-Emulator-Full cargo build --release" \
            cargo build --release --manifest-path Dioptase-Emulators/Dioptase-Emulator-Full/Cargo.toml
          run_command "Dioptase-Emulator-Full cargo test --release" \
            cargo test --release --manifest-path Dioptase-Emulators/Dioptase-Emulator-Full/Cargo.toml

          run_command "Dioptase-C-Compiler clean" \
            make -C Dioptase-Languages/Dioptase-C-Compiler clean
          run_command "Dioptase-C-Compiler release" \
            make -C Dioptase-Languages/Dioptase-C-Compiler release
          run_summary_make Dioptase-Languages/Dioptase-C-Compiler test-release

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dioptase-toolchain-test-logs
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/dioptase-toolchain-tests.log
            Dioptase-Assembler/tests/**/*.hex
            Dioptase-Assembler/tests/**/*.debug
            Dioptase-Languages/Dioptase-C-Compiler/tests/**/*.out
            Dioptase-Languages/Dioptase-C-Compiler/tests/debug_info/*.s

  os-tests:
    name: Dioptase OS release aggregate test suite
    runs-on:
      - self-hosted
      - linux
      - x64
      - dioptase-os
    timeout-minutes: 720

    defaults:
      run:
        shell: bash

    env:
      DIOPTASE_OS_TEST_RUNS: ${{ github.event.inputs.test_runs || '10' }}
      DIOPTASE_OS_TEST_LOG: ${{ runner.temp }}/dioptase-os-tests.log

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check host dependencies
        run: |
          missing=0
          for cmd in cargo cmp du gcc grep head make mkfs.ext2 python3 sed timeout; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "Missing required Dioptase OS test dependency: $cmd" >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Install the missing tools on the self-hosted runner before running Dioptase OS tests." >&2
            exit 1
          fi

      - name: Run OS release tests
        run: |
          case "$DIOPTASE_OS_TEST_RUNS" in
            ''|*[!0-9]*)
              echo "Invalid test_runs value: '$DIOPTASE_OS_TEST_RUNS'. Expected a positive integer." >&2
              exit 1
              ;;
          esac

          if [ "$DIOPTASE_OS_TEST_RUNS" -le 0 ]; then
            echo "Invalid test_runs value: '$DIOPTASE_OS_TEST_RUNS'. Expected a positive integer." >&2
            exit 1
          fi

          set -o pipefail

          rebuild_release_dependency() {
            label="$1"
            shift
            echo "::group::$label"
            set +e
            "$@" 2>&1 | tee -a "$DIOPTASE_OS_TEST_LOG"
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if [ "$status" -ne 0 ]; then
              echo "$label failed with status $status." >&2
              exit "$status"
            fi
          }

          : > "$DIOPTASE_OS_TEST_LOG"

          rebuild_release_dependency "Dioptase-Assembler clean" \
            make -C Dioptase-Assembler clean
          rebuild_release_dependency "Dioptase-Assembler release" \
            make -C Dioptase-Assembler release
          rebuild_release_dependency "Dioptase-Emulator-Full cargo clean --release" \
            cargo clean --release --manifest-path Dioptase-Emulators/Dioptase-Emulator-Full/Cargo.toml
          rebuild_release_dependency "Dioptase-Emulator-Full cargo build --release" \
            cargo build --release --manifest-path Dioptase-Emulators/Dioptase-Emulator-Full/Cargo.toml
          rebuild_release_dependency "Dioptase-C-Compiler clean" \
            make -C Dioptase-Languages/Dioptase-C-Compiler clean
          rebuild_release_dependency "Dioptase-C-Compiler release" \
            make -C Dioptase-Languages/Dioptase-C-Compiler release
          rebuild_release_dependency "Dioptase-OS clean" \
            make -C Dioptase-OS clean

          echo "::group::Dioptase-OS release tests"
          set -o pipefail
          make -C Dioptase-OS test VERSION=release TEST_RUNS="$DIOPTASE_OS_TEST_RUNS" 2>&1 | tee -a "$DIOPTASE_OS_TEST_LOG"
          make_status=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$make_status" -ne 0 ]; then
            echo "Dioptase OS test harness exited with status $make_status." >&2
            exit "$make_status"
          fi

          if grep -E '^\[[^]]+\] fail:' "$DIOPTASE_OS_TEST_LOG"; then
            echo "Dioptase OS test summaries reported at least one failing baseline." >&2
            exit 1
          fi

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dioptase-os-test-logs
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/dioptase-os-tests.log
            Dioptase-OS/tests/*.raw
            Dioptase-OS/tests/*.out
            Dioptase-OS/tests/*.out.dir/**
            Dioptase-OS/build/*.labels

  sleep-host:
    name: Suspend Windows host
    needs:
      - toolchain-tests
      - os-tests
    if: ${{ always() && !cancelled() && vars.DIOPTASE_SLEEP_AFTER_TESTS != 'false' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.sleep_after == 'true')) }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - dioptase-os
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Suspend Windows host
        run: |
          script_path="$GITHUB_WORKSPACE/.github/scripts/Suspend-Windows.ps1"

          if ! command -v powershell.exe >/dev/null 2>&1 || ! command -v wslpath >/dev/null 2>&1; then
            echo "Windows PowerShell interop is not available from this runner; leaving the host awake." >&2
            exit 0
          fi

          if ! powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' >/dev/null 2>&1; then
            echo "Windows PowerShell was found but could not execute from this runner; leaving the host awake." >&2
            exit 0
          fi

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$script_path")" -DelaySeconds 120
