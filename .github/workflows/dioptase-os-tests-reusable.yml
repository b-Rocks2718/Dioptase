name: Dioptase OS Tests (Reusable)

on:
  workflow_call:
    inputs:
      os_branch:
        description: "Optional: Branch of Dioptase-OS subrepo to test. If not provided, uses current checkout."
        required: false
        type: string
      test_runs:
        description: "Number of repetitions for each baseline-checked OS test."
        required: true
        type: string
      artifact_name:
        description: "Name suffix for uploaded artifacts"
        required: true
        type: string

jobs:
  os-tests:
    name: Dioptase OS release failure-preserving test suite
    runs-on:
      - self-hosted
      - linux
      - x64
      - dioptase-os
    timeout-minutes: 720

    defaults:
      run:
        shell: bash

    env:
      DIOPTASE_OS_TEST_RUNS: ${{ inputs.test_runs }}
      DIOPTASE_OS_TEST_LOG: .dioptase-ci-logs/dioptase-os-tests.log

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Dioptase-OS branch
        if: ${{ inputs.os_branch != '' }}
        run: |
          cd Dioptase-OS
          git fetch origin "${{ inputs.os_branch }}:refs/remotes/origin/${{ inputs.os_branch }}"
          git checkout -B "${{ inputs.os_branch }}" "origin/${{ inputs.os_branch }}"

      - name: Check host dependencies
        run: |
          missing=0
          for cmd in cargo cmp du gcc grep head make mkfs.ext2 python3 sed timeout; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "Missing required Dioptase OS test dependency: $cmd" >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Install the missing tools on the self-hosted runner before running Dioptase OS tests." >&2
            exit 1
          fi

      - name: Run OS release tests
        run: |
          case "$DIOPTASE_OS_TEST_RUNS" in
            ''|*[!0-9]*)
              echo "Invalid test_runs value: '$DIOPTASE_OS_TEST_RUNS'. Expected a positive integer." >&2
              exit 1
              ;;
          esac

          if [ "$DIOPTASE_OS_TEST_RUNS" -le 0 ]; then
            echo "Invalid test_runs value: '$DIOPTASE_OS_TEST_RUNS'. Expected a positive integer." >&2
            exit 1
          fi

          set -o pipefail

          rebuild_release_dependency() {
            label="$1"
            shift
            echo "::group::$label"
            set +e
            "$@" 2>&1 | tee -a "$DIOPTASE_OS_TEST_LOG"
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if [ "$status" -ne 0 ]; then
              echo "$label failed with status $status." >&2
              exit "$status"
            fi
          }

          mkdir -p "$(dirname "$DIOPTASE_OS_TEST_LOG")"
          : > "$DIOPTASE_OS_TEST_LOG"

          rebuild_release_dependency "Dioptase-Assembler clean" \
            make -C Dioptase-Assembler clean
          rebuild_release_dependency "Dioptase-Assembler release" \
            make -C Dioptase-Assembler release
          rebuild_release_dependency "Dioptase-Emulator-Full cargo clean --release" \
            cargo clean --release --manifest-path Dioptase-Emulators/Dioptase-Emulator-Full/Cargo.toml
          rebuild_release_dependency "Dioptase-Emulator-Full cargo build --release" \
            cargo build --release --manifest-path Dioptase-Emulators/Dioptase-Emulator-Full/Cargo.toml
          rebuild_release_dependency "Dioptase-C-Compiler clean" \
            make -C Dioptase-Languages/Dioptase-C-Compiler clean
          rebuild_release_dependency "Dioptase-C-Compiler release" \
            make -C Dioptase-Languages/Dioptase-C-Compiler release
          rebuild_release_dependency "Dioptase-OS clean" \
            make -C Dioptase-OS clean

          os_fail_targets=()
          for ok in Dioptase-OS/tests/*.ok; do
            if [ -e "$ok" ]; then
              test_name="${ok##*/}"
              # Running the self-hosted bcc inside Dioptase is intentionally
              # much slower than ordinary OS integration tests. Keep it as an
              # explicit local test instead of multiplying it by every CI run.
              if [ "$test_name" = "user_bcc_include_recursion.ok" ]; then
                continue
              fi
              os_fail_targets+=("${test_name%.ok}.fail")
            fi
          done

          if [ "${#os_fail_targets[@]}" -eq 0 ]; then
            echo "No Dioptase OS tests with .ok baselines were found under Dioptase-OS/tests." >&2
            exit 1
          fi

          echo "::group::Dioptase-OS release tests"
          set -o pipefail
          make -C Dioptase-OS -j16 --output-sync=target VERSION=release TEST_RUNS="$DIOPTASE_OS_TEST_RUNS" "${os_fail_targets[@]}" 2>&1 | tee -a "$DIOPTASE_OS_TEST_LOG"
          make_status=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$make_status" -ne 0 ]; then
            echo "Dioptase OS test harness exited with status $make_status." >&2
            exit "$make_status"
          fi

          if grep -E '^\[[^]]+\] run [0-9]+/[0-9]+: fail' "$DIOPTASE_OS_TEST_LOG"; then
            echo "Dioptase OS .fail targets reported at least one failing baseline." >&2
            exit 1
          fi

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dioptase-os-test-logs-${{ inputs.artifact_name }}
          if-no-files-found: ignore
          path: |
            .dioptase-ci-logs/dioptase-os-tests.log
            Dioptase-OS/tests/*.raw
            Dioptase-OS/tests/*.out
            Dioptase-OS/tests/*.out.dir/**
            Dioptase-OS/build/*.labels
